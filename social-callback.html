<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>geoni — bağlantı kodu</title>
<style>
  :root { --bg:#131419; --surface:#1b1d26; --text:#ebedf5; --muted:#9ba0b8;
          --accent:#7C86F5; --border:rgba(124,134,245,.25); }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px;
          padding:36px 32px; max-width:520px; width:calc(100% - 40px); text-align:center; }
  h1 { font-size:1.15rem; margin:0 0 8px; }
  p { color:var(--muted); font-size:.9rem; margin:0 0 20px; line-height:1.5; }
  code { display:block; background:#0f1015; border:1px solid var(--border); border-radius:9px;
         padding:14px; font-size:.8rem; word-break:break-all; margin-bottom:14px;
         font-family:"SF Mono",ui-monospace,Menlo,monospace; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:11px 26px; font-size:.9rem; font-weight:600; cursor:pointer; }
  button:hover { opacity:.9; }
  .ok { color:#2fbd84; font-size:.85rem; margin-top:10px; min-height:1.2em; }
</style>
</head>
<body>
<div class="card">
  <h1>Bağlantı kodu hazır</h1>
  <p>Bu tek kullanımlık yetkilendirme kodunu kopyalayıp terminaldeki
     auth komutuna yapıştır. Bu sayfa kodu hiçbir yere göndermez.</p>
  <code id="code">kod bulunamadı — URL'de ?code= yok</code>
  <button id="copy" type="button">Kodu kopyala</button>
  <div class="ok" id="ok"></div>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var code = params.get("code");
  var el = document.getElementById("code");
  if (code) el.textContent = code;
  document.getElementById("copy").addEventListener("click", function () {
    if (!code) return;
    navigator.clipboard.writeText(code).then(function () {
      document.getElementById("ok").textContent = "Kopyalandı ✓";
    });
  });
</script>
</body>
</html>
