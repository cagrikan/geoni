# AWS CodeBuild: geoni-scanner imajini derle + ECR'a push et.
# Lokal Mac'te amd64 Playwright imaji derlemek disk yuttugu icin build
# buluta alindi (2026-07-14). Kaynak S3 zip'i olarak gelir; baslatma:
# scripts yerine dogrudan: aws codebuild start-build --project-name geoni-scanner-build
version: 0.2

env:
  variables:
    ECR: "016031489497.dkr.ecr.eu-central-1.amazonaws.com"
    REPO: "geoni-scanner"

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin $ECR
  build:
    commands:
      # :latest (App Runner/ECS ceker) + :$SHA immutable (rollback/denetim izi).
      - SHA=${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}
      # Kosan commit imaja YAZILIR; /health onu geri veriyor. Dagitimin
      # gercekten YENI kodu tasidigi ancak boyle dogrulanabiliyor —
      # App Runner "RUNNING" demesi hangi commit oldugunu SOYLEMIYOR.
      # deploy.sh zip'lemeden once gercek git SHA'sini yaziyor; kaynak S3 zip
      # oldugu icin CODEBUILD_RESOLVED_SOURCE_VERSION burada BOS gelir
      # ("manual"). O yuzden yalniz dosya YOKSA yaz — uzerine yazma.
      - "[ -s SURUM.txt ] || echo \"$SHA\" > SURUM.txt"
      # Etiket SURUM.txt'ten okunur: S3 kaynakli build'de $SHA hep "manual"
      # geliyordu, yani "immutable" etiket her derlemede bir oncekini eziyordu.
      - ETIKET=$(cat SURUM.txt)
      - docker build -t $ECR/$REPO:latest -t $ECR/$REPO:$ETIKET .
  post_build:
    commands:
      - docker push $ECR/$REPO:latest
      - docker push $ECR/$REPO:$(cat SURUM.txt)
