name: Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - 'geoni-scanner/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kalite kapısı: testler kırmızıysa AŞAĞIDAKİ hiçbir adım (build/push/deploy)
      # çalışmaz. Para/güvenlik yüzeyini (SSRF, webhook imza, kredi idempotency)
      # kilitler — denetim #9.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests (deploy gate)
        run: |
          cd geoni-scanner
          python -m pip install --quiet pytest httpx
          python -m pytest tests/ -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      
      - name: Login to ECR
        run: aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 016031489497.dkr.ecr.eu-central-1.amazonaws.com
      
      - name: Build Docker image
        run: cd geoni-scanner && docker build --platform linux/amd64 -t 016031489497.dkr.ecr.eu-central-1.amazonaws.com/geoni-scanner:latest .
      
      - name: Push to ECR
        run: docker push 016031489497.dkr.ecr.eu-central-1.amazonaws.com/geoni-scanner:latest
      
      # API artık App Runner'da (2026-07-18 taşıma), ECS geoni-scanner-service silindi.
      - name: Deploy API (App Runner) + worker (ECS)
        run: |
          aws apprunner start-deployment --region eu-central-1 --service-arn arn:aws:apprunner:eu-central-1:016031489497:service/geoni-scanner-api/61139b9ae7114ea88304c93458af9ff9
          aws ecs update-service --cluster geoni-cluster --service geoni-scan-worker --force-new-deployment --region eu-central-1

      - name: Wait for worker to stabilize
        run: aws ecs wait services-stable --cluster geoni-cluster --services geoni-scan-worker --region eu-central-1
