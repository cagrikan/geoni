name: Deploy to AWS ECS

on:
  workflow_dispatch:        # elle tetikleme (OIDC/pipeline degisikligini dogrulamak icin)
  push:
    branches: [main]
    paths:
      - 'geoni-scanner/**'
      - '.github/workflows/deploy.yml'   # workflow degisikligi de deploy'u dogrular

jobs:
  deploy:
    runs-on: ubuntu-latest
    # OIDC: uzun-omurlu AWS anahtari yerine gecici rol (geoni-gha-deploy).
    # id-token:write GitHub'in OIDC token'ini uretmesi icin ZORUNLU.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Kalite kapısı: testler kırmızıysa AŞAĞIDAKİ hiçbir adım (build/push/deploy)
      # çalışmaz. Para/güvenlik yüzeyini (SSRF, webhook imza, kredi idempotency)
      # kilitler — denetim #9.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🔴 LINT KAPISI (2026-08-08 eklendi). NEDEN: `job_id` tanimlanmadan
      # kullaniliyordu -> UnboundLocalError -> 500 -> kullanicida "Load failed".
      # 4 GUN canlida kaldi, ucretsiz hakla yapilan HER marka/sosyal taramayi
      # kirdi, kurucu kendi kullanirken buldu. Testler bu yolu hic cagirmiyordu
      # (ic tarama anahtari ucretsiz-hak kapisini atliyor) — ama pyflakes iki
      # satiri da ANINDA yakaliyordu. 2 saniyelik kontrol 4 gunu kurtarirdi.
      # Kapi YALNIZ calisma zamaninda patlayan sinifta kapanir; kozmetik
      # bulgular (kullanilmayan import vb.) dagitimi engellemez.
      - name: Lint gate (tanimsiz isim)
        run: |
          cd geoni-scanner
          python -m pip install --quiet pyflakes
          bash scripts/lint-kapisi.sh

      - name: Run tests (deploy gate)
        run: |
          cd geoni-scanner
          # cbor2+cryptography: App Attest testleri (tests/test_attest.py)
          # pillow: paylasim karti testleri (tests/test_kismi_olcum_cekincesi.py).
          # 🪤 2026-08-09'da YASANDI: pillow yereldeki venv'de VARDI, CI'da YOKTU.
          #    `import card` patlayinca pytest TOPLAMA asamasinda durdu -> TEK BIR
          #    test bile kosmadi ve dagitim kapisi kapandi. Yerelde yesil gormek
          #    yetmiyor; yeni bir bagimlilik kullanan test eklenince BU SATIR da
          #    guncellenmeli. (bkz. feedback-ci-ortaminda-dogrula)
          python -m pip install --quiet pytest httpx cbor2 cryptography pillow
          python -m pytest tests/ -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::016031489497:role/geoni-gha-deploy
          aws-region: eu-central-1
      
      - name: Login to ECR
        run: aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 016031489497.dkr.ecr.eu-central-1.amazonaws.com
      
      # :latest App Runner/ECS'in cektigi tag (davranis ayni). Ek olarak :$SHA
      # immutable tag: her deploy'un tam kaynagi ECR'de kalir -> gerektiginde
      # belirli bir surume rollback + denetim izi (mutable :latest yaris riski).
      # 🔴 KOSAN COMMIT IMAJA YAZILIR (2026-08-08). /health onu geri veriyor
      # (main.py:_kosan_commit). Dagitim dogrulamasi bugune kadar App Runner'in
      # `Status == RUNNING` degerine bakiyordu; o yalnizca "bir surum ayakta"
      # demek, "ITTIGIM commit ayakta" DEMEK DEGIL — bir izleyici tam bu yuzden
      # yanlis "hala bozuk" raporu yazdi. Damga ASIL DAGITIM YOLUNDA (burada)
      # olmak zorunda: deploy.sh/CodeBuild yalniz elle kullanilan yedek yol.
      # Dogrulama: curl -s https://api.geoni.ai/health | grep "$(git rev-parse HEAD)"
      - name: Build Docker image
        run: |
          cd geoni-scanner
          echo "${{ github.sha }}" > SURUM.txt
          REPO=016031489497.dkr.ecr.eu-central-1.amazonaws.com/geoni-scanner
          docker build --platform linux/amd64 -t $REPO:latest -t $REPO:${{ github.sha }} .

      - name: Push to ECR
        run: |
          REPO=016031489497.dkr.ecr.eu-central-1.amazonaws.com/geoni-scanner
          docker push $REPO:latest
          docker push $REPO:${{ github.sha }}

      # API artık App Runner'da (2026-07-18 taşıma), ECS geoni-scanner-service silindi.
      # Worker'a deployment circuit breaker (rollback=true): bozuk task ayaga
      # kalkamazsa ECS otomatik onceki saglikli revizyona doner (App Runner'in
      # kendi health-check rollback'i zaten var). Idempotent — her deploy'da uygulanir.
      - name: Deploy API (App Runner) + worker (ECS)
        run: |
          # App Runner AutoDeployments zaten yeni ECR :latest'i OTOMATIK deploy eder; asagidaki
          # explicit start-deployment yalniz RUNNING iken denenir. Hizli ardisik push'larda
          # servis MESGULSE (onceki auto-deploy suruyor) "isn't in RUNNING state" hatasi
          # CI'yi kirmasin -> atla (auto-deploy yeni imaji zaten alacak). Worker deploy'u
          # HER durumda kosar (eskiden apprunner hatasi -e ile worker'i da bloklardi).
          AR="arn:aws:apprunner:eu-central-1:016031489497:service/geoni-scanner-api/61139b9ae7114ea88304c93458af9ff9"
          ST=$(aws apprunner describe-service --region eu-central-1 --service-arn "$AR" --query "Service.Status" --output text 2>/dev/null || echo UNKNOWN)
          if [ "$ST" = "RUNNING" ]; then
            aws apprunner start-deployment --region eu-central-1 --service-arn "$AR" || echo "start-deployment atlandi (auto-deploy devrede)"
          else
            echo "App Runner durumu=$ST -> explicit start-deployment atlandi; AutoDeployments yeni imaji alacak."
          fi
          aws ecs update-service --cluster geoni-cluster --service geoni-scan-worker --force-new-deployment --region eu-central-1 \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true}"

      - name: Wait for worker to stabilize
        run: aws ecs wait services-stable --cluster geoni-cluster --services geoni-scan-worker --region eu-central-1
